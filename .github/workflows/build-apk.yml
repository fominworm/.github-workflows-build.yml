name: Build TapTap Bot APK

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-unpack ZIP archive
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            for z in *.zip; do
              if [ -f "$z" ]; then
                unzip -o "$z"
              fi
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TapTap-Bot-HayDay.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: TapTap-Bot-APK
          path: TapTap-Bot-HayDay.apk
          retention-days: 30
