name: Build HayBot APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Full Android Project
        run: |
          python3 - << 'EOF'
          import os, textwrap

          def write_file(path, content):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).strip() + "\n")

          write_file("settings.gradle", """
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "HayBot"
          include ':app'
          """)

          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          """)

          write_file("build.gradle", """
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          """)

          write_file("app/build.gradle", """
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.haybot'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.haybot'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '2.0-Pro'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          """)

          write_file("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.supercell.hayday" />
              </queries>
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".BotService"
                      android:exported="false"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          """)

          write_file("app/src/main/res/xml/accessibility_config.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/svc_desc"
              android:notificationTimeout="100" />
          """)

          write_file("app/src/main/res/values/strings.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">TapTapBot Pro</string>
              <string name="svc_desc">Рисует панель поверх игры и автоматизирует посев, сбор и лавку Hay Day.</string>
          </resources>
          """)

          write_file("app/src/main/java/com/example/haybot/Cfg.kt", """
          package com.example.haybot

          import android.content.Context
          import android.content.SharedPreferences
          import org.json.JSONArray
          import org.json.JSONObject

          data class P(val x: Float, val y: Float)
          data class MTap(val p: P, val dtMs: Long)

          enum class T(
              val icon: String,
              val label: String,
              val multi: Boolean,
              val min: Int,
              val color: Int,
              val perField: Boolean = false
          ) {
              FIELD("🌱", "Грядка", false, 1, 0xFF4CAF50.toInt(), true),
              WHEAT("🌾", "Культура", false, 1, 0xFFFFC107.toInt(), true),
              AREA("🧭", "Поле", true, 4, 0xFF29B6F6.toInt(), true),
              HFIELD("🌿", "Грядка (сбор)", false, 1, 0xFF8BC34A.toInt(), true),
              SICKLE("🔪", "Серп", false, 1, 0xFFEF5350.toInt(), true),
              GROUND("🟫", "Пустая земля", false, 0, 0xFF8D6E63.toInt()),
              SHOP("🏪", "Лавка", false, 0, 0xFFAB47BC.toInt()),
              SLOT("🧺", "Слот", true, 1, 0xFFFF7043.toInt()),
              SWIPE("↔", "Листание лавки", true, 0, 0xFF7E57C2.toInt()),
              SLOT2("🧺²", "Слоты стр. 2", true, 0, 0xFFFF8A65.toInt()),
              SLOT3("🧺³", "Слоты стр. 3", true, 0, 0xFFFFAB91.toInt()),
              ITEM("📦", "Товар", false, 1, 0xFFFFCA28.toInt()),
              ITEMS("🔎", "Ячейки списка", true, 0, 0xFFFFE082.toInt()),
              EXTRA("➕", "Доп. кнопка", true, 0, 0xFF26A69A.toInt()),
              AD("📢", "Реклама", false, 0, 0xFFEC407A.toInt()),
              PUT("✅", "Выставить", false, 1, 0xFF66BB6A.toInt()),
              CLOSE("❌", "Закрыть", false, 1, 0xFFE53935.toInt())
          }

          class Cfg(ctx: Context) {
              companion object {
                  const val MAXF = 4
                  const val MAXM = 5
              }

              private val sp = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              private val prof = ctx.getSharedPreferences("profiles", Context.MODE_PRIVATE)
              private val pts = HashMap<String, MutableList<P>>()
              var cur = 0
              var onExternalChange: (() -> Unit)? = null

              private val listener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  if (key == "rev") {
                      reload()
                      onExternalChange?.invoke()
                  }
              }

              init {
                  reload()
                  sp.registerOnSharedPreferenceChangeListener(listener)
              }

              private fun key(t: T, f: Int) = if (t.perField && f > 0) t.name + "#" + f else t.name

              fun reload() {
                  pts.clear()
                  for (f in 0 until MAXF) {
                      for (t in T.values()) {
                          if (f > 0 && !t.perField) continue
                          val k = key(t, f)
                          pts[k] = dec(sp.getString(k, null))
                      }
                  }
              }

              var sellEvery: Int
                  get() = sp.getInt("every", 3)
                  set(v) { sp.edit().putInt("every", v.coerceIn(1, 9)).apply() }

              var rowGap: Int
                  get() = sp.getInt("gap", 45)
                  set(v) { sp.edit().putInt("gap", v.coerceIn(15, 150)).apply() }

              var useRec: Boolean
                  get() = sp.getBoolean("rec", true)
                  set(v) { sp.edit().putBoolean("rec", v).apply() }

              var holdMs: Int
                  get() = sp.getInt("hold", 600)
                  set(v) { sp.edit().putInt("hold", v.coerceIn(100, 2000)).apply() }

              var plantMode: Int
                  get() = sp.getInt("pmode", 3)
                  set(v) { sp.edit().putInt("pmode", ((v % 4) + 4) % 4).apply() }

              var shopPages: Int
                  get() = sp.getInt("spages", 1).coerceIn(1, 6)
                  set(v) { sp.edit().putInt("spages", v.coerceIn(1, 6)).apply() }

              var swipeMs: Int
                  get() = sp.getInt("swms", 700).coerceIn(400, 2000)
                  set(v) { sp.edit().putInt("swms", v.coerceIn(400, 2000)).apply() }

              var returnHand: Int
                  get() = sp.getInt("rhand", 1)
                  set(v) { sp.edit().putInt("rhand", if (v > 0) 1 else 0).apply() }

              var edgePct: Int
                  get() = sp.getInt("edge", 12)
                  set(v) { sp.edit().putInt("edge", v.coerceIn(0, 25)).apply() }

              var speedPlant: Int
                  get() = sp.getInt("spp", 100)
                  set(v) { sp.edit().putInt("spp", v.coerceIn(50, 200)).apply() }

              var speedHarvest: Int
                  get() = sp.getInt("sph", 100)
                  set(v) { sp.edit().putInt("sph", v.coerceIn(50, 200)).apply() }

              var speedShop: Int
                  get() = sp.getInt("sps", 120)
                  set(v) { sp.edit().putInt("sps", v.coerceIn(50, 300)).apply() }

              fun setWheatPatch(a: IntArray) {
                  sp.edit().putString("wpat", a.joinToString(",")).apply()
              }

              fun getWheatPatch(): IntArray? {
                  val s = sp.getString("wpat", "") ?: ""
                  if (s.isBlank()) return null
                  return try { s.split(",").map { it.toInt() }.toIntArray() } catch (_: Exception) { null }
              }

              var groundMs: Int
                  get() = sp.getInt("gms", 1600)
                  set(v) { sp.edit().putInt("gms", v.coerceIn(600, 4000)).apply() }

              var cells: Int
                  get() = sp.getInt("cells", 60)
                  set(v) { sp.edit().putInt("cells", v.coerceAtLeast(0)).apply() }

              var perCell: Int
                  get() = sp.getInt("pcell", 2)
                  set(v) { sp.edit().putInt("pcell", v.coerceAtLeast(1)).apply() }

              var barnCap: Int
                  get() = sp.getInt("bcap", 300)
                  set(v) { sp.edit().putInt("bcap", v.coerceAtLeast(0)).apply() }

              var barnUsed: Int
                  get() = sp.getInt("bused", 100)
                  set(v) { sp.edit().putInt("bused", v.coerceAtLeast(0)).apply() }

              var perSlot: Int
                  get() = sp.getInt("pslot", 10)
                  set(v) { sp.edit().putInt("pslot", v.coerceAtLeast(1)).apply() }

              var fieldCount: Int
                  get() = sp.getInt("fcount", 1).coerceIn(1, MAXF)
                  set(v) { sp.edit().putInt("fcount", v.coerceIn(1, MAXF)).apply() }

              fun grow(f: Int = cur): Int = sp.getInt(if (f > 0) "grow#$f" else "grow", 120)
              fun setGrow(v: Int, f: Int = cur) {
                  sp.edit().putInt(if (f > 0) "grow#$f" else "grow", v.coerceIn(20, 3600)).apply()
              }

              fun getRef(t: T, f: Int = cur): Int? {
                  val k = "ref_" + key(t, f)
                  return if (sp.contains(k)) sp.getInt(k, 0) else null
              }

              fun setRef(t: T, c: Int, f: Int = cur) {
                  sp.edit().putInt("ref_" + key(t, f), c).apply()
              }

              private fun mlist(t: T, f: Int): MutableList<P> = pts.getOrPut(key(t, f)) { mutableListOf() }
              fun list(t: T, f: Int = cur): List<P> = mlist(t, f)
              fun first(t: T, f: Int = cur): P? = mlist(t, f).firstOrNull()

              fun add(t: T, p: P) {
                  val l = mlist(t, cur)
                  if (!t.multi) l.clear()
                  l.add(p)
                  save()
              }

              fun clear(t: T) {
                  mlist(t, cur).clear()
                  save()
                  sp.edit().remove("ref_" + key(t, cur)).apply()
                  if (t == T.ITEM) sp.edit().remove("wpat").apply()
              }

              fun missingPair(): Pair<Int, T>? {
                  for (f in 0 until fieldCount) {
                      for (t in listOf(T.FIELD, T.WHEAT, T.AREA, T.HFIELD, T.SICKLE)) {
                          if (list(t, f).size < t.min) return Pair(f, t)
                      }
                  }
                  if (first(T.SHOP, 0) != null) {
                      for (t in listOf(T.SLOT, T.ITEM, T.PUT, T.CLOSE)) {
                          if (list(t, 0).size < t.min) return Pair(0, t)
                      }
                  }
                  return null
              }

              fun exportJson(): String {
                  val o = JSONObject()
                  o.put("v", 2)
                  o.put("every", sellEvery); o.put("gap", rowGap); o.put("rec", useRec)
                  o.put("hold", holdMs); o.put("pmode", plantMode); o.put("fcount", fieldCount)
                  o.put("spages", shopPages); o.put("rhand", returnHand); o.put("edge", edgePct)
                  o.put("spp", speedPlant); o.put("sph", speedHarvest); o.put("sps", speedShop)
                  o.put("wpat", sp.getString("wpat", "") ?: ""); o.put("swms", swipeMs)
                  val g = JSONObject()
                  for (f in 0 until MAXF) g.put("g$f", grow(f))
                  o.put("grow", g)
                  val p = JSONObject()
                  for ((k, l) in pts) p.put(k, enc(l))
                  o.put("pts", p)
                  val r = JSONObject()
                  for (f in 0 until MAXF) {
                      for (t in T.values()) {
                          if (f > 0 && !t.perField) continue
                          val ref = getRef(t, f)
                          if (ref != null) r.put(key(t, f), ref)
                      }
                  }
                  o.put("ref", r)
                  return o.toString()
              }

              fun importJson(s: String): Boolean {
                  return try {
                      val o = JSONObject(s.trim())
                      val p = o.optJSONObject("pts") ?: return false
                      val r = o.optJSONObject("ref")
                      val e = sp.edit()
                      e.putInt("every", o.optInt("every", 3).coerceIn(1, 9))
                      e.putInt("gap", o.optInt("gap", 45).coerceIn(15, 150))
                      e.putBoolean("rec", o.optBoolean("rec", true))
                      e.putInt("hold", o.optInt("hold", 600).coerceIn(100, 2000))
                      e.putInt("pmode", o.optInt("pmode", 3))
                      e.putInt("fcount", o.optInt("fcount", 1).coerceIn(1, MAXF))
                      e.putInt("spages", o.optInt("spages", 1).coerceIn(1, 6))
                      e.putInt("rhand", o.optInt("rhand", 1))
                      e.putInt("edge", o.optInt("edge", 12).coerceIn(0, 25))
                      e.putInt("spp", o.optInt("spp", 100).coerceIn(50, 200))
                      e.putInt("sph", o.optInt("sph", 100).coerceIn(50, 200))
                      e.putInt("sps", o.optInt("sps", 120).coerceIn(50, 300))
                      e.putString("wpat", o.optString("wpat", ""))
                      e.putInt("swms", o.optInt("swms", 700).coerceIn(400, 2000))
                      val g = o.optJSONObject("grow")
                      for (f in 0 until MAXF) {
                          val v = if (g != null) g.optInt("g$f", 120) else 120
                          e.putInt(if (f > 0) "grow#$f" else "grow", v.coerceIn(20, 3600))
                      }
                      for (f in 0 until MAXF) {
                          for (t in T.values()) {
                              if (f > 0 && !t.perField) continue
                              val k = key(t, f)
                              e.putString(k, p.optString(k, ""))
                              if (r != null && r.has(k)) e.putInt("ref_$k", r.getInt(k)) else e.remove("ref_$k")
                          }
                      }
                      e.putInt("rev", sp.getInt("rev", 0) + 1)
                      e.apply()
                      reload()
                      true
                  } catch (_: Exception) { false }
              }

              private fun save() {
                  val e = sp.edit()
                  for ((k, l) in pts) e.putString(k, enc(l))
                  e.apply()
              }

              private fun enc(l: List<P>) = l.joinToString(";") { "${it.x},${it.y}" }
              private fun dec(s: String?): MutableList<P> {
                  if (s.isNullOrBlank()) return mutableListOf()
                  return s.split(";").mapNotNull {
                      val a = it.split(",")
                      if (a.size == 2) P(a[0].toFloat(), a[1].toFloat()) else null
                  }.toMutableList()
              }
          }
          """)

          write_file("app/src/main/java/com/example/haybot/Flow.kt", """
          package com.example.haybot

          enum class Kind { TAP, MULTI, WAIT, DO, ASK, INFO, SWIPE, RECT }

          class Stp(
              val kind: Kind,
              val role: T?,
              val text: String,
              val hint: String,
              val replay: Boolean = false,
              val fresh: Boolean = true,
              val btn: String? = null,
              val skip: String? = null,
              val min: Int = 0,
              val max: Int = 0,
              val sample: Boolean = false,
              val act: String? = null,
              val settle: Long = 850
          )

          val FLOW: List<Stp> = listOf(
              Stp(Kind.INFO, null, "Поставь камеру руками", "Отдали карту и поставь ПОЛЕ БЛИЖЕ К ЦЕНТРУ экрана, подальше от краёв. Должны быть видны поле, лавка и пустая земля.", btn = "Камера готова ▶"),
              Stp(Kind.TAP, T.FIELD, "Нажми на стартовую грядку", "Я повторю нажатие: откроется меню посева.", replay = true, settle = 1600),
              Stp(Kind.TAP, T.WHEAT, "Нажми на культуру в меню (пшеница)", "Только запомню координаты иконки."),
              Stp(Kind.RECT, T.AREA, "Растяни рамку по полю", "Тяни за 4 угла, чтобы накрыть поле ромбом. Линии покажут маршрут пальца.", btn = "Готово ✓"),
              Stp(Kind.TAP, T.GROUND, "Нажми на пустую землю рядом с полем", "После посева бот зажмёт эту точку, чтобы мгновенно остановить уход камеры.", skip = "Не нужно"),
              Stp(Kind.DO, null, "Проверка посева", "Бот засеет поле, вернет палец в старт и зажмет землю.", btn = "🌱 Посадить", act = "plant"),
              Stp(Kind.WAIT, null, "Пшеница растёт ⏳", "Дождись созревания пшеницы и жми дальше.", btn = "Выросла — дальше ▶"),
              Stp(Kind.TAP, T.HFIELD, "Нажми на спелую грядку", "Запомню цвет спелой пшеницы и вызову серп.", replay = true, sample = true),
