                          eMode.text.toString().toIntOrNull()?.let { cfg.plantMode = it }
                          eSpPlant.text.toString().toIntOrNull()?.let { cfg.speedPlant = it }
                          eSpHarv.text.toString().toIntOrNull()?.let { cfg.speedHarvest = it }
                          eSpShop.text.toString().toIntOrNull()?.let { cfg.speedShop = it }
                          eGround.text.toString().toIntOrNull()?.let { cfg.groundMs = it }
                          Toast.makeText(this@MainActivity, "Сохранено!", Toast.LENGTH_SHORT).show()
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "📋 Экспорт профиля в буфер (JSON)"
                      setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("haybot_pro", cfg.exportJson()))
                          Toast.makeText(this@MainActivity, "Профиль скопирован в буфер", Toast.LENGTH_SHORT).show()
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "📥 Импорт профиля из буфера (JSON)"
                      setOnClickListener {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val s = cm.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                          if (cfg.importJson(s)) {
                              Toast.makeText(this@MainActivity, "Профиль загружен!", Toast.LENGTH_SHORT).show()
                              recreate()
                          } else {
                              Toast.makeText(this@MainActivity, "Неверный JSON в буфере", Toast.LENGTH_SHORT).show()
                          }
                      }
                  })

                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  val on = BotService.instance != null
                  tvState.text = if (on) "🟢 Служба активна (панель поверх игры включена)"
                  else "🔴 Служба выключена. На Android 13/14: Настройки -> Приложения -> TapTapBot Pro -> ⋮ (три точки в углу) -> Разрешить ограниченные настройки."
                  tvState.setTextColor(if (on) Color.GREEN else Color.parseColor("#FF7043"))
              }
          }
          """)
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: HayBot-Pro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
