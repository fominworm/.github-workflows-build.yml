        package com.korobov.haydaybot.data
        import android.content.Context
        import android.content.SharedPreferences
        import com.google.gson.Gson
        class PreferencesManager(context: Context) {
            private val prefs: SharedPreferences = context.getSharedPreferences("hayday_bot_prefs", Context.MODE_PRIVATE)
            private val gson = Gson()
            fun saveProfile(profile: BotProfile) { prefs.edit().putString("active_profile", gson.toJson(profile)).apply() }
            fun loadProfile(): BotProfile {
                val json = prefs.getString("active_profile", null) ?: return BotProfile()
                return try { gson.fromJson(json, BotProfile::class.java) } catch (e: Exception) { BotProfile() }
            }
            fun exportToJson(profile: BotProfile): String = gson.toJson(profile)
        }
        EOF

        # 15. GeometryEngine.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/engine/GeometryEngine.kt
        package com.korobov.haydaybot.engine
        import android.graphics.PointF
        import com.korobov.haydaybot.data.PointData
        class GeometryEngine {
            fun findAnchorPoint(corners: List<PointData>): PointF {
                require(corners.isNotEmpty())
                return (corners.maxByOrNull { it.x + it.y } ?: corners[0]).toPointF()
            }
            fun generateClosedRoute(corners: List<PointData>, rowSpacingPx: Float = 40f): List<PointF> {
                if (corners.size < 4) return emptyList()
                val anchor = findAnchorPoint(corners)
                val sortedCorners = corners.sortedWith(compareBy({ it.y }, { it.x }))
                val topY = sortedCorners.first().y
                val bottomY = sortedCorners.last().y
                val pathPoints = mutableListOf<PointF>()
                pathPoints.add(anchor)
                val minX = corners.minOf { it.x }
                val maxX = corners.maxOf { it.x }
                var currentY = topY
                var goingRight = true
                while (currentY <= bottomY) {
                    pathPoints.add(PointF(if (goingRight) minX else maxX, currentY))
                    pathPoints.add(PointF(if (goingRight) maxX else minX, currentY))
                    currentY += rowSpacingPx
                    goingRight = !goingRight
                }
                pathPoints.add(anchor)
                return pathPoints
            }
        }
        EOF

        # 16. GestureEngine.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/engine/GestureEngine.kt
        package com.korobov.haydaybot.engine
        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.graphics.Path
        import android.graphics.PointF
        import kotlinx.coroutines.suspendCancellableCoroutine
        import kotlin.coroutines.resume
        class GestureEngine(private val service: AccessibilityService) {
            suspend fun performPinch(centerX: Float, centerY: Float, startOffset: Float, endOffset: Float, durationMs: Long, zoomOut: Boolean): Boolean = suspendCancellableCoroutine { cont ->
                val maxR = Math.min(centerX, centerY) * 0.9f
                val d1 = maxR * startOffset
                val d2 = maxR * endOffset
                val (dist1, dist2) = if (zoomOut) Pair(d1, d2) else Pair(d2, d1)
                val p1 = Path().apply { moveTo(centerX - dist1, centerY); lineTo(centerX - dist2, centerY) }
                val p2 = Path().apply { moveTo(centerX + dist1, centerY); lineTo(centerX + dist2, centerY) }
                val s1 = GestureDescription.StrokeDescription(p1, 0, durationMs)
                val s2 = GestureDescription.StrokeDescription(p2, 0, durationMs)
                val builder = GestureDescription.Builder().addStroke(s1).addStroke(s2)
                service.dispatchGesture(builder.build(), object : AccessibilityService.GestureResultCallback() {
                    override fun onCompleted(g: GestureDescription?) { cont.resume(true) }
                    override fun onCancelled(g: GestureDescription?) { cont.resume(false) }
                }, null)
            }
            suspend fun performContinuousGesture(points: List<PointF>, durationMs: Long): Boolean = suspendCancellableCoroutine { cont ->
                if (points.isEmpty()) { cont.resume(false); return@suspendCancellableCoroutine }
                val path = Path().apply {
                    moveTo(points[0].x, points[0].y)
                    for (i in 1 until points.size) lineTo(points[i].x, points[i].y)
                }
                val stroke = GestureDescription.StrokeDescription(path, 0, durationMs)
                val builder = GestureDescription.Builder().addStroke(stroke)
                service.dispatchGesture(builder.build(), object : AccessibilityService.GestureResultCallback() {
                    override fun onCompleted(g: GestureDescription?) { cont.resume(true) }
                    override fun onCancelled(g: GestureDescription?) { cont.resume(false) }
                }, null)
            }
            suspend fun performTap(x: Float, y: Float): Boolean = suspendCancellableCoroutine { cont ->
                val path = Path().apply { moveTo(x, y) }
                val stroke = GestureDescription.StrokeDescription(path, 0, 50L)
                val builder = GestureDescription.Builder().addStroke(stroke)
                service.dispatchGesture(builder.build(), object : AccessibilityService.GestureResultCallback() {
                    override fun onCompleted(g: GestureDescription?) { cont.resume(true) }
                    override fun onCancelled(g: GestureDescription?) { cont.resume(false) }
                }, null)
            }
        }
        EOF

