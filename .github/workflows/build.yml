          package com.example.haybot

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.AlertDialog
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.util.Random
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.concurrent.thread
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.min

          class BotService : AccessibilityService() {
              companion object {
                  @Volatile var instance: BotService? = null
                  private const val HAYDAY_PKG = "com.supercell.hayday"
                  private const val AD_COOLDOWN_MS = 300_000L
                  private const val SILO_MARGIN = 8
              }

              private lateinit var wm: WindowManager
              private lateinit var cfg: Cfg
              private lateinit var markView: MarkView
              private lateinit var markParams: WindowManager.LayoutParams
              private lateinit var panel: LinearLayout
              private lateinit var panelParams: WindowManager.LayoutParams
              private lateinit var tvStatus: TextView
              private lateinit var tvHint: TextView
              private lateinit var btnPrimary: Button
              private lateinit var btnSecondary: Button
              private lateinit var btnBack: Button
              private lateinit var btnFieldSel: Button
              private val mainHandler = Handler(Looper.getMainLooper())
              private val rng = Random()

              @Volatile private var running = false
              @Volatile private var gameInForeground = true
              private var worker: Thread? = null
              private var stepIdx = 0
              private var lastAdMs = 0L
              private var watchdogFails = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  cfg = Cfg(this)
                  cfg.onExternalChange = { mainHandler.post { showIdleUi(); markView.invalidate() } }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  initOverlay()
                  showIdleUi()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                      val pkg = event.packageName?.toString() ?: return
                      if (pkg == packageName || pkg == "android" || pkg.startsWith("com.android.systemui")) return
                      gameInForeground = (pkg == HAYDAY_PKG)
                  }
              }

              override fun onInterrupt() { stopBot() }
              override fun onDestroy() {
                  stopBot()
                  runCatching { wm.removeView(markView) }
                  runCatching { wm.removeView(panel) }
                  instance = null
                  super.onDestroy()
              }

              private fun overlayType() = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                  WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY
              else @Suppress("DEPRECATION") WindowManager.LayoutParams.TYPE_PHONE

              private fun initOverlay() {
                  markView = MarkView(this, cfg)
                  markParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  wm.addView(markView, markParams)

                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(0xDD1E1E24.toInt())
                      setPadding(24, 16, 24, 16)
                  }
                  val header = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val dragTv = TextView(this).apply { text = "≡ HayBot "; setTextColor(Color.parseColor("#FFCA28")); textSize = 14f }
                  tvStatus = TextView(this).apply { text = "Готов"; setTextColor(Color.WHITE); textSize = 12f; layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }

                  btnFieldSel = Button(this).apply {
                      text = "П1"
                      textSize = 11f
                      setOnClickListener {
                          cfg.cur = (cfg.cur + 1) % cfg.fieldCount
                          text = "П${cfg.cur + 1}"
                          markView.invalidate()
                          showIdleUi()
                      }
                  }

                  val btnEye = Button(this).apply {
                      text = "👁"; textSize = 11f
                      setOnClickListener { markView.showAll = !markView.showAll; markView.invalidate() }
                  }
                  header.addView(dragTv); header.addView(tvStatus); header.addView(btnFieldSel); header.addView(btnEye)

                  tvHint = TextView(this).apply { setTextColor(0xFFCCCCCC.toInt()); textSize = 11f; setPadding(0, 6, 0, 8) }
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  btnBack = Button(this).apply { text = "↩"; visibility = View.GONE; setOnClickListener { if (stepIdx > 0) { stepIdx--; renderStep() } else showIdleUi() } }
                  btnPrimary = Button(this).apply { layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                  btnSecondary = Button(this).apply { layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }
                  row.addView(btnBack); row.addView(btnPrimary); row.addView(btnSecondary)

                  panel.addView(header); panel.addView(tvHint); panel.addView(row)
                  panelParams = WindowManager.LayoutParams(
                      -2, -2, overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START; x = 30; y = 100
                  }
                  var ix = 0; var iy = 0; var tx = 0f; var ty = 0f
                  header.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { ix = panelParams.x; iy = panelParams.y; tx = e.rawX; ty = e.rawY; true }
                          MotionEvent.ACTION_MOVE -> { panelParams.x = ix + (e.rawX - tx).toInt(); panelParams.y = iy + (e.rawY - ty).toInt(); wm.updateViewLayout(panel, panelParams); true }
                          else -> false
                      }
                  }
                  wm.addView(panel, panelParams)
              }

              private fun armMark(armed: Boolean, rect: Boolean = false, swipe: Boolean = false) {
                  mainHandler.post {
                      markView.armed = armed; markView.editMode = rect; markView.swipeMode = swipe
                      markParams.flags = if (armed) WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      else WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                      runCatching { wm.updateViewLayout(markView, markParams) }
                      markView.invalidate()
                  }
              }

              private fun showIdleUi() {
                  mainHandler.post {
                      armMark(false)
                      btnFieldSel.text = "П${cfg.cur + 1}/${cfg.fieldCount}"
                      val miss = cfg.missingPair()
                      tvStatus.text = if (running) "🟢 Работает | Силос: ${cfg.barnUsed}/${cfg.barnCap}" else "⚪ Готов | Силос: ${cfg.barnUsed}/${cfg.barnCap}"
                      tvHint.text = if (miss != null) "Не настроено: Поле ${miss.first + 1} -> ${miss.second.icon} ${miss.second.label}" else "Все точки готовы. Нажми Старт."
                      btnBack.visibility = View.GONE
                      btnPrimary.text = if (running) "⏹ Стоп" else "▶ Старт"
                      btnPrimary.setOnClickListener { if (running) stopBot() else askSiloAndStart() }
                      btnSecondary.visibility = View.VISIBLE
                      btnSecondary.text = "⚙ Мастер"
                      btnSecondary.setOnClickListener { if (!running) { stepIdx = 0; renderStep() } }
                  }
              }

              private fun askSiloAndStart() {
                  val miss = cfg.missingPair()
                  if (miss != null) { cfg.cur = miss.first; stepIdx = 0; renderStep(); return }
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 20, 40, 10) }
                  fun field(lbl: String, v: Int): EditText {
                      box.addView(TextView(this).apply { text = lbl })
                      return EditText(this).apply { inputType = InputType.TYPE_CLASS_NUMBER; setText(v.toString()); box.addView(this) }
                  }
                  val eCells = field("Количество грядок на поле (cells):", cfg.cells)
                  val eUsed = field("Сейчас занято в силосной башне:", cfg.barnUsed)
                  val eCap = field("Лимит силосной башни (макс.):", cfg.barnCap)
                  val dlg = AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle("Контроль силосной башни (х2 сбор)")
                      .setView(box)
                      .setPositiveButton("Старт") { _, _ ->
                          cfg.cells = eCells.text.toString().toIntOrNull() ?: cfg.cells
                          cfg.barnUsed = eUsed.text.toString().toIntOrNull() ?: cfg.barnUsed
                          cfg.barnCap = eCap.text.toString().toIntOrNull() ?: cfg.barnCap
                          startLoop()
                      }
                      .setNegativeButton("Отмена", null).create()
                  dlg.window?.setType(overlayType())
                  dlg.show()
              }

              private fun nextStep() { if (stepIdx + 1 < FLOW.size) { stepIdx++; renderStep() } else showIdleUi() }

              private fun renderStep() {
                  val s = FLOW[stepIdx]
                  tvStatus.text = "П${cfg.cur + 1} Шаг ${stepIdx + 1}/${FLOW.size}: ${s.text}"
                  tvHint.text = s.hint
                  btnBack.visibility = View.VISIBLE
                  markView.onTap = null; markView.onSwipe = null
                  when (s.kind) {
                      Kind.INFO, Kind.WAIT -> {
                          armMark(false)
                          btnPrimary.text = s.btn ?: "Дальше ▶"; btnPrimary.setOnClickListener { nextStep() }
                          btnSecondary.visibility = View.GONE
                      }
                      Kind.ASK -> {
                          armMark(false)
                          btnPrimary.text = s.btn ?: "Да ▶"; btnPrimary.setOnClickListener { nextStep() }
                          btnSecondary.visibility = View.VISIBLE; btnSecondary.text = s.skip ?: "Пропустить"; btnSecondary.setOnClickListener { showIdleUi() }
                      }
                      Kind.RECT -> {
                          val area = cfg.list(T.AREA).toMutableList()
                          if (area.size < 4) {
                              val dm = resources.displayMetrics; val cx = dm.widthPixels / 2f; val cy = dm.heightPixels / 2f
                              area.clear(); area.add(P(cx - 220f, cy)); area.add(P(cx, cy - 130f)); area.add(P(cx + 220f, cy)); area.add(P(cx, cy + 130f))
                          }
                          markView.editPts = area
                          armMark(true, rect = true)
                          btnPrimary.text = s.btn ?: "Готово ✓"
                          btnPrimary.setOnClickListener { cfg.clear(T.AREA); area.forEach { cfg.add(T.AREA, it) }; markView.editPts = null; nextStep() }
                          btnSecondary.visibility = View.GONE
                      }
                      Kind.TAP -> {
                          if (s.fresh && s.role != null && s.role.multi) cfg.clear(s.role)
                          armMark(true)
                          btnPrimary.text = "Жду тапа..."; btnPrimary.setOnClickListener(null)
                          if (s.skip != null) { btnSecondary.visibility = View.VISIBLE; btnSecondary.text = s.skip; btnSecondary.setOnClickListener { nextStep() } }
                          else btnSecondary.visibility = View.GONE
                          markView.onTap = { x, y ->
                              val pt = P(x, y)
                              if (s.role != null) cfg.add(s.role, pt)
                              armMark(false)
                              thread {
                                  if (s.sample && s.role != null) {
                                      Thread.sleep(150)
                                      takeScreen()?.let { bmp ->
                                          cfg.setRef(s.role, Vision.sampleColor(bmp, pt))
                                          if (s.role == T.ITEM) cfg.setWheatPatch(Vision.extractCropIconPatch(bmp, pt))
                                          bmp.recycle()
                                      }
                                  }
                                  if (s.replay) { Thread.sleep(120); tapSync(pt); Thread.sleep(s.settle) }
                                  mainHandler.post { nextStep() }
                              }
                          }
                      }
                      Kind.MULTI -> {
                          if (s.fresh && s.role != null) cfg.clear(s.role)
                          armMark(true)
                          btnPrimary.text = s.btn ?: "Готово ✓"; btnPrimary.setOnClickListener { nextStep() }
                          if (s.skip != null) { btnSecondary.visibility = View.VISIBLE; btnSecondary.text = s.skip; btnSecondary.setOnClickListener { nextStep() } }
                          else btnSecondary.visibility = View.GONE
                          markView.onTap = { x, y ->
                              val pt = P(x, y)
                              if (s.role != null && (s.max == 0 || cfg.list(s.role).size < s.max)) cfg.add(s.role, pt)
                              markView.invalidate()
                              if (s.replay) {
                                  armMark(false)
                                  thread { Thread.sleep(100); tapSync(pt); Thread.sleep(450); mainHandler.post { armMark(true) } }
                              }
                          }
                      }
                      Kind.SWIPE -> {
                          armMark(true, swipe = true)
                          btnPrimary.text = "Свайпни..."
                          if (s.skip != null) { btnSecondary.visibility = View.VISIBLE; btnSecondary.text = s.skip; btnSecondary.setOnClickListener { cfg.shopPages = 1; showIdleUi() } }
                          markView.onSwipe = { p1, p2, dur ->
                              if (s.role != null) { cfg.clear(s.role); cfg.add(s.role, p1); cfg.add(s.role, p2) }
                              cfg.swipeMs = dur.toInt().coerceIn(400, 2000); cfg.shopPages = max(2, cfg.shopPages)
                              armMark(false)
                              thread { Thread.sleep(150); swipeSync(p1, p2, cfg.swipeMs.toLong()); Thread.sleep(650); mainHandler.post { nextStep() } }
                          }
                      }
                      Kind.DO -> {
                          armMark(false)
                          btnPrimary.text = s.btn ?: "Выполнить"
                          btnPrimary.setOnClickListener {
                              thread {
                                  when (s.act) {
                                      "plant" -> doPlant(cfg.cur)
                                      "harvest" -> doHarvestWithRetry(cfg.cur, maxRetries = 1)
                                      "swipe2" -> {
                                          val sw = cfg.list(T.SWIPE)
                                          if (sw.size >= 2) { cfg.shopPages = 3; swipeSync(sw[0], sw[1], cfg.swipeMs.toLong()); Thread.sleep(650) }
                                      }
                                  }
                                  mainHandler.post { nextStep() }
                              }
                          }
                          if (s.skip != null) {
                              btnSecondary.visibility = View.VISIBLE; btnSecondary.text = s.skip
                              btnSecondary.setOnClickListener { stepIdx = FLOW.indexOfFirst { it.role == T.CLOSE }.coerceAtLeast(stepIdx + 1); renderStep() }
                          } else btnSecondary.visibility = View.GONE
                      }
                  }
              }

              private fun waitUntilGameForeground() {
                  while (running && !gameInForeground) {
                      status("⏸ Пауза: вернись в окно Hay Day...")
                      sleepMs(1500L)
                  }
              }

              private fun startLoop() {
                  if (running) return
                  running = true; watchdogFails = 0; gameInForeground = true; showIdleUi()
                  worker = thread {
                      var cycle = 0
                      var sessionStartMs = System.currentTimeMillis()
                      var nextBreakAfterMs = (35 + rng.nextInt(15)) * 60_000L

                      while (running) {
                          waitUntilGameForeground()
                          if (!running) break

                          if (System.currentTimeMillis() - sessionStartMs >= nextBreakAfterMs) {
                              val breakSec = 120 + rng.nextInt(90)
                              for (s in breakSec downTo 1) {
                                  if (!running) break
                                  status("☕ Анти-бан перерыв: ${s}с...")
                                  sleepMs(1000L)
                              }
                              sessionStartMs = System.currentTimeMillis()
                              nextBreakAfterMs = (35 + rng.nextInt(15)) * 60_000L
                          }

                          cycle++
                          for (f in 0 until cfg.fieldCount) {
                              if (!running) break
                              waitUntilGameForeground()

                              val gain = cfg.cells * cfg.perCell
                              if (cfg.barnCap > 0 && cfg.barnUsed + gain > cfg.barnCap - SILO_MARGIN) {
                                  status("Силос (${cfg.barnUsed}/${cfg.barnCap}) -> Разгрузка перед сбором...")
                                  sellInShop(gain)
                              }

                              status("Круг $cycle: сбор поля ${f + 1}...")
                              val harvested = doHarvestWithRetry(f, maxRetries = 5)
                              if (harvested && cfg.cells > 0) {
                                  cfg.barnUsed = min(if (cfg.barnCap > 0) cfg.barnCap else Int.MAX_VALUE, cfg.barnUsed + gain)
                              }
                              sleepMs(Geo.jitterDelay(550))
                              if (!running) break

                              status("Круг $cycle: посев поля ${f + 1}...")
                              if (doPlant(f) && cfg.cells > 0) {
                                  cfg.barnUsed = max(0, cfg.barnUsed - cfg.cells)
                              }
                              val plantedAt = System.currentTimeMillis()
                              if (!running) break

                              val nearFull = cfg.barnCap > 0 && (cfg.barnUsed + gain > cfg.barnCap - SILO_MARGIN)
                              if ((nearFull || cycle % cfg.sellEvery == 0) && cfg.first(T.SHOP, 0) != null) {
                                  status("Продажа в лавке во время роста пшеницы...")
                                  sellInShop(if (nearFull) gain else cfg.perSlot * 2)
                              }

                              val growMs = cfg.grow(f) * 1000L
                              while (running) {
                                  val rem = ((growMs - (System.currentTimeMillis() - plantedAt)) / 1000L).coerceAtLeast(0L)
                                  if (rem <= 0L) break
                                  status("⏳ Поле ${f + 1} рост: ${rem}с | Силос: ${cfg.barnUsed}/${cfg.barnCap}")
                                  sleepMs(1000L)
                              }
                          }
                      }
                      mainHandler.post { showIdleUi() }
                  }
              }

              fun stopBot() { running = false; worker?.interrupt(); worker = null; showIdleUi() }
              private fun status(s: String) { mainHandler.post { if (running) tvStatus.text = s } }

              private fun doPlant(f: Int): Boolean {
                  waitUntilGameForeground()
                  val fp = cfg.first(T.FIELD, f) ?: return false
                  val wp = cfg.first(T.WHEAT, f) ?: return false
                  val area = cfg.list(T.AREA, f)
                  if (area.size < 4) return false

                  tapSync(Geo.jitterTap(fp))
                  sleepMs(Geo.jitterDelay(750, cfg.speedPlant))
                  val dm = resources.displayMetrics
                  val rawSnake = Geo.zigzagFrom(area, cfg.rowGap.toFloat(), fp, dm.widthPixels, dm.heightPixels, cfg.edgePct)
                  val snake = Geo.applyPlantMode(rawSnake, cfg.plantMode, dm.widthPixels, dm.heightPixels, cfg.edgePct)

                  holdSweepReturnSync(wp, fp, snake, Geo.jitterDelay(cfg.holdMs.toLong(), cfg.speedPlant), cfg.speedPlant, cfg.returnHand > 0)
                  lockGround()
                  return true
              }

              private fun doHarvestWithRetry(f: Int, maxRetries: Int): Boolean {
                  val hp = cfg.first(T.HFIELD, f) ?: cfg.first(T.FIELD, f) ?: return false
                  val sp = cfg.first(T.SICKLE, f) ?: return false
                  val area = cfg.list(T.AREA, f)
                  if (area.size < 4) return false

                  for (attempt in 1..maxRetries) {
                      if (!running && maxRetries > 1) return false
                      waitUntilGameForeground()

                      var fieldReady = true
                      cfg.getRef(T.HFIELD, f)?.let { ref ->
                          if (cfg.useRec) takeScreen()?.let { bmp ->
                              fieldReady = Vision.matchesColor(bmp, hp, ref, 58.0)
                              bmp.recycle()
                          }
                      }

                      if (fieldReady) {
                          tapSync(Geo.jitterTap(hp))
                          sleepMs(Geo.jitterDelay(750, cfg.speedHarvest))

                          var sickleReady = true
                          cfg.getRef(T.SICKLE, f)?.let { sRef ->
                              if (cfg.useRec) takeScreen()?.let { bmp ->
                                  sickleReady = Vision.matchesColor(bmp, sp, sRef, 60.0)
                                  bmp.recycle()
                              }
                          }

                          if (sickleReady) {
                              watchdogFails = 0
                              val dm = resources.displayMetrics
                              val rawSnake = Geo.zigzagFrom(area, cfg.rowGap.toFloat(), hp, dm.widthPixels, dm.heightPixels, cfg.edgePct)
                              val snake = Geo.applyPlantMode(rawSnake, cfg.plantMode, dm.widthPixels, dm.heightPixels, cfg.edgePct)
                              holdSweepReturnSync(sp, hp, snake, Geo.jitterDelay(cfg.holdMs.toLong(), cfg.speedHarvest), cfg.speedHarvest, cfg.returnHand > 0)
                              lockGround()

                              val closePt = cfg.first(T.CLOSE, 0)
                              val refClose = cfg.getRef(T.CLOSE, 0)
                              if (cfg.useRec && closePt != null && refClose != null) {
                                  takeScreen()?.let { bmp ->
                                      val popup = Vision.matchesColor(bmp, closePt, refClose, 48.0)
                                      bmp.recycle()
                                      if (popup) {
                                          status("⚠ Силос переполнился! Разгружаю...")
                                          tapSync(Geo.jitterTap(closePt))
                                          sleepMs(600L)
                                          if (cfg.barnCap > 0) cfg.barnUsed = cfg.barnCap
                                          sellInShop(cfg.cells * cfg.perCell)
                                      }
                                  }
                              }
                              return true
                          }
                      }

                      if (attempt < maxRetries) {
                          onFail("Ожидание созревания ($attempt/$maxRetries)")
                          sleepMs(5500L)
                      }
                  }
                  return false
              }

              private fun lockGround() {
                  val gp = cfg.first(T.GROUND, 0) ?: return
                  sleepMs(40L)
                  holdPointSync(Geo.jitterTap(gp), Geo.jitterDelay(cfg.groundMs.toLong()))
                  sleepMs(100L)
              }

              private fun sellInShop(targetFree: Int) {
                  waitUntilGameForeground()
                  val shopPt = cfg.first(T.SHOP, 0) ?: return
                  val putPt = cfg.first(T.PUT, 0) ?: return
                  val closePt = cfg.first(T.CLOSE, 0) ?: return
                  val spShop = cfg.speedShop

                  tapSync(Geo.jitterTap(shopPt))
                  sleepMs(Geo.jitterDelay(950, spShop))

                  val wpat = cfg.getWheatPatch()
                  val cands = cfg.list(T.ITEMS, 0).ifEmpty { cfg.list(T.ITEM, 0) }
                  val extras = cfg.list(T.EXTRA, 0)
                  val adPt = cfg.first(T.AD, 0)
                  val refPut = cfg.getRef(T.PUT, 0)
                  var sold = 0
                  val pages = cfg.shopPages.coerceIn(1, 6)

                  loop@ for (pg in 0 until pages) {
                      if (!running) break
                      val slots = when (pg) {
                          0 -> cfg.list(T.SLOT, 0)
                          1 -> cfg.list(T.SLOT2, 0).ifEmpty { cfg.list(T.SLOT, 0) }
                          else -> cfg.list(T.SLOT3, 0).ifEmpty { cfg.list(T.SLOT2, 0).ifEmpty { cfg.list(T.SLOT, 0) } }
                      }
                      for ((idx, sl) in slots.withIndex()) {
                          if (!running || cfg.barnUsed < cfg.perSlot) break@loop
                          waitUntilGameForeground()

                          tapSync(Geo.jitterTap(sl))
                          sleepMs(Geo.jitterDelay(420, spShop))
                          var open = checkPutVisible(putPt, refPut)
                          if (!open) {
                              tapSync(Geo.jitterTap(sl))
                              sleepMs(Geo.jitterDelay(480, spShop))
                              open = checkPutVisible(putPt, refPut)
                          }
                          if (!open) continue

                          var cropPt: P? = cfg.first(T.ITEM, 0)
                          if (cands.isNotEmpty() && wpat != null) {
                              takeScreen()?.let { bmp ->
                                  cropPt = Vision.findBestCropCell(bmp, cands, wpat, 82.0)
                                  bmp.recycle()
                              }
                          }
                          if (cropPt == null) {
                              tapSync(Geo.jitterTap(closePt)); sleepMs(450L); break@loop
                          }
                          tapSync(Geo.jitterTap(cropPt!!))
                          sleepMs(Geo.jitterDelay(380, spShop))
                          for (ex in extras) { tapSync(Geo.jitterTap(ex)); sleepMs(Geo.jitterDelay(250, spShop)) }

                          val nextSold = sold + cfg.perSlot
                          val nextRem = cfg.barnUsed - cfg.perSlot
                          val isLastSlot = (pg == pages - 1 && idx == slots.size - 1) || (nextSold >= targetFree) || (nextRem < cfg.perSlot)
                          val now = System.currentTimeMillis()
                          if (isLastSlot && adPt != null && (now - lastAdMs >= AD_COOLDOWN_MS)) {
                              tapSync(Geo.jitterTap(adPt))
                              sleepMs(Geo.jitterDelay(320, spShop))
                              lastAdMs = System.currentTimeMillis()
                          }

                          tapSync(Geo.jitterTap(putPt))
                          sleepMs(Geo.jitterDelay(520, spShop))
                          cfg.barnUsed = max(0, cfg.barnUsed - cfg.perSlot)
                          sold += cfg.perSlot
                          if (nextSold >= targetFree) break@loop
                      }
                      if (pg + 1 < pages) {
                          val sw = cfg.list(T.SWIPE, 0)
                          if (sw.size >= 2) { swipeSync(sw[0], sw[1], cfg.swipeMs.toLong()); sleepMs(Geo.jitterDelay(550, spShop)) } else break
                      }
                  }
                  tapSync(Geo.jitterTap(closePt))
                  sleepMs(Geo.jitterDelay(550, spShop))
                  lockGround()
              }

              private fun checkPutVisible(putPt: P, refPut: Int?): Boolean {
                  if (!cfg.useRec || refPut == null) return true
                  val bmp = takeScreen() ?: return true
                  val ok = Vision.matchesColor(bmp, putPt, refPut, 52.0)
                  bmp.recycle()
                  return ok
              }

              private fun onFail(msg: String) {
                  watchdogFails++
                  status("⚠ $msg")
                  if (watchdogFails >= 2) {
                      cfg.first(T.CLOSE, 0)?.let { tapSync(Geo.jitterTap(it)); sleepMs(650L) }
                      lockGround()
                      watchdogFails = 0
                  }
              }

              private fun tapSync(p: P): Boolean {
                  val path = Path().apply { moveTo(p.x, p.y) }
                  return dispatchSync(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0L, 55L)).build())
              }

              private fun holdPointSync(p: P, ms: Long): Boolean {
                  val path = Path().apply { moveTo(p.x, p.y); lineTo(p.x + 0.5f, p.y + 0.5f) }
                  return dispatchSync(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0L, ms.coerceIn(100L, 10000L))).build())
              }

              private fun swipeSync(p1: P, p2: P, ms: Long): Boolean {
                  val path = Path().apply { moveTo(p1.x, p1.y); lineTo(p2.x, p2.y) }
                  return dispatchSync(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0L, ms.coerceIn(150L, 5000L))).build())
              }

              private fun holdSweepReturnSync(icon: P, start: P, snake: List<P>, holdMs: Long, speedPct: Int, ret: Boolean): Boolean {
                  if (snake.isEmpty()) return false
                  val dist = buildList { add(icon); add(start); addAll(snake); if (ret) add(start) }
                      .zipWithNext { a, b -> hypot(b.x - a.x, b.y - a.y) }.sum()
                  val baseSweep = (dist / 1.4f) * (100f / speedPct.coerceIn(50, 200))
                  val sweepMs = baseSweep.toLong().coerceIn(850L, 12000L)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val p1 = Path().apply { moveTo(icon.x, icon.y); lineTo(icon.x + 1f, icon.y + 1f) }
                      val s1 = GestureDescription.StrokeDescription(p1, 0L, holdMs.coerceIn(150L, 3000L), true)
                      if (!dispatchSync(GestureDescription.Builder().addStroke(s1).build())) return false
                      val p2 = Path().apply {
                          moveTo(icon.x + 1f, icon.y + 1f); lineTo(start.x, start.y)
                          for (pt in snake) lineTo(pt.x, pt.y)
                          if (ret) lineTo(start.x, start.y)
                      }
                      val s2 = s1.continueStroke(p2, 0L, sweepMs, false)
                      return dispatchSync(GestureDescription.Builder().addStroke(s2).build())
                  } else {
                      val pf = Path().apply {
                          moveTo(icon.x, icon.y); lineTo(start.x, start.y)
                          for (pt in snake) lineTo(pt.x, pt.y)
                          if (ret) lineTo(start.x, start.y)
                      }
                      return dispatchSync(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(pf, 0L, holdMs + sweepMs)).build())
                  }
              }

              private fun dispatchSync(g: GestureDescription): Boolean {
                  val l = CountDownLatch(1); var ok = false
                  if (!dispatchGesture(g, object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) { ok = true; l.countDown() }
                      override fun onCancelled(gestureDescription: GestureDescription?) { l.countDown() }
                  }, mainHandler)) return false
                  runCatching { l.await(15, TimeUnit.SECONDS) }
                  return ok
              }

              private fun takeScreen(): Bitmap? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val l = CountDownLatch(1); var res: Bitmap? = null
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                      override fun onSuccess(s: ScreenshotResult) {
                          runCatching {
                              val hw = Bitmap.wrapHardwareBuffer(s.hardwareBuffer, s.colorSpace)
                              res = hw?.copy(Bitmap.Config.ARGB_8888, false)
                              hw?.recycle(); s.hardwareBuffer.close()
                          }
                          l.countDown()
                      }
                      override fun onFailure(errorCode: Int) { l.countDown() }
                  })
                  runCatching { l.await(4, TimeUnit.SECONDS) }
                  return res
              }

              private fun sleepMs(ms: Long) { try { Thread.sleep(ms.coerceAtLeast(10L)) } catch (_: InterruptedException) {} }
          }
          """)

