        # 23. MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/ui/MainActivity.kt
        package com.korobov.haydaybot.ui
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import androidx.appcompat.app.AppCompatActivity
        import com.korobov.haydaybot.data.BotProfile
        import com.korobov.haydaybot.data.PreferencesManager
        import com.korobov.haydaybot.databinding.ActivityMainBinding
        import com.korobov.haydaybot.utils.LogManager
        class MainActivity : AppCompatActivity() {
            private lateinit var binding: ActivityMainBinding
            private lateinit var prefsManager: PreferencesManager
            private lateinit var profile: BotProfile
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                binding = ActivityMainBinding.inflate(layoutInflater)
                setContentView(binding.root)
                prefsManager = PreferencesManager(this)
                profile = prefsManager.loadProfile()
                binding.etGamePkg.setText(profile.gamePkg)
                binding.timePickerGrow.setTimeSeconds(profile.growTimeSec)
                binding.timePickerGrow.setPresets(listOf(60, 300, 900, 1800))
                binding.timePickerGrow.onTimeChangedListener = { profile.growTimeSec = it; prefsManager.saveProfile(profile) }
                binding.timePickerLoad.setTimeSeconds(profile.loadTimeSec)
                binding.timePickerLoad.setPresets(listOf(15, 30, 45, 60))
                binding.timePickerLoad.onTimeChangedListener = { profile.loadTimeSec = it; prefsManager.saveProfile(profile) }
                binding.btnAccessibilitySettings.setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                binding.btnStartWizard.setOnClickListener { startActivity(Intent(this, WizardActivity::class.java)) }
                binding.btnStartBot.setOnClickListener {
                    profile.gamePkg = binding.etGamePkg.text.toString().trim()
                    prefsManager.saveProfile(profile)
                }
            }
            override fun onResume() {
                super.onResume()
                binding.tvLogs.text = LogManager.getLogs().joinToString("\n")
            }
        }
        EOF

