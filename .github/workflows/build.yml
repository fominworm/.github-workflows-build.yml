        # 18. LogManager.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/utils/LogManager.kt
        package com.korobov.haydaybot.utils
        import java.text.SimpleDateFormat
        import java.util.*
        object LogManager {
            private val logs = mutableListOf<String>()
            private const val MAX_LOGS = 50
            @Synchronized fun log(msg: String) {
                val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                logs.add("[$time] $msg")
                if (logs.size > MAX_LOGS) logs.removeAt(0)
            }
            @Synchronized fun getLogs(): List<String> = logs.toList()
        }
        EOF

        # 19. TimePickerWidget.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/ui/TimePickerWidget.kt
        package com.korobov.haydaybot.ui
        import android.content.Context
        import android.util.AttributeSet
        import android.view.LayoutInflater
        import android.widget.LinearLayout
        import com.korobov.haydaybot.databinding.ViewTimePickerBinding
        import java.util.Locale
        class TimePickerWidget @JvmOverloads constructor(context: Context, attrs: AttributeSet? = null, defStyleAttr: Int = 0) : LinearLayout(context, attrs, defStyleAttr) {
            private val binding = ViewTimePickerBinding.inflate(LayoutInflater.from(context), this, true)
            var onTimeChangedListener: ((Int) -> Unit)? = null
            private var minutes = 5
            private var seconds = 0
            init {
                orientation = VERTICAL
                binding.sliderMinutes.addOnChangeListener { _, v, u -> if (u) { minutes = v.toInt(); updateUI(true) } }
                binding.sliderSeconds.addOnChangeListener { _, v, u -> if (u) { seconds = v.toInt(); updateUI(true) } }
                binding.btnMinMinus.setOnClickListener { if (minutes > 0) { minutes--; binding.sliderMinutes.value = minutes.toFloat(); updateUI(true) } }
                binding.btnMinPlus.setOnClickListener { if (minutes < 59) { minutes++; binding.sliderMinutes.value = minutes.toFloat(); updateUI(true) } }
                binding.btnSecMinus.setOnClickListener { if (seconds >= 5) { seconds -= 5; binding.sliderSeconds.value = seconds.toFloat(); updateUI(true) } }
                binding.btnSecPlus.setOnClickListener { if (seconds <= 55) { seconds += 5; binding.sliderSeconds.value = seconds.toFloat(); updateUI(true) } }
            }
            fun setTimeSeconds(totalSec: Int) {
                minutes = (totalSec / 60).coerceIn(0, 59)
                seconds = (totalSec % 60).coerceIn(0, 59)
                binding.sliderMinutes.value = minutes.toFloat()
                binding.sliderSeconds.value = seconds.toFloat()
                updateUI(false)
            }
            fun getTimeSeconds(): Int = minutes * 60 + seconds
            fun setPresets(presets: List<Int>) {
                binding.layoutPresets.removeAllViews()
                for (sec in presets) {
                    val btn = com.google.android.material.button.MaterialButton(context).apply {
                        text = String.format(Locale.getDefault(), "%02d:%02d", sec / 60, sec % 60)
                        setOnClickListener { setTimeSeconds(sec); onTimeChangedListener?.invoke(getTimeSeconds()) }
                    }
                    binding.layoutPresets.addView(btn)
                }
            }
            private fun updateUI(notify: Boolean) {
                binding.tvTimeDisplay.text = String.format(Locale.getDefault(), "%02d:%02d", minutes, seconds)
                if (notify) onTimeChangedListener?.invoke(getTimeSeconds())
            }
        }
        EOF

        # 20. OverlayHudManager.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/ui/OverlayHudManager.kt
        package com.korobov.haydaybot.ui
        import android.content.Context
        import android.graphics.PixelFormat
        import android.os.Build
        import android.view.*
        import com.korobov.haydaybot.databinding.ViewHudBinding
        class OverlayHudManager(private val context: Context, private val onStopRequested: () -> Unit) {
            private val windowManager = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
            private val binding = ViewHudBinding.inflate(LayoutInflater.from(context))
            private val layoutParams = WindowManager.LayoutParams(
                WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                PixelFormat.TRANSLUCENT
            ).apply { gravity = Gravity.TOP or Gravity.START; x = 100; y = 100 }
            init {
                binding.btnHudStop.setOnClickListener { onStopRequested() }
            }
            fun show() { try { windowManager.addView(binding.root, layoutParams) } catch (_: Exception) {} }
            fun hide() { try { windowManager.removeView(binding.root) } catch (_: Exception) {} }
            fun updateStatus(status: String, stats: String) {
                binding.tvHudStatus.text = status
                binding.tvHudStats.text = stats
            }
        }
        EOF

        # 21. HayDayAccessibilityService.kt
        cat << 'EOF' > app/src/main/java/com/korobov/haydaybot/service/HayDayAccessibilityService.kt
        package com.korobov.haydaybot.service
        import android.accessibilityservice.AccessibilityService
        import android.content.Intent
        import android.view.accessibility.AccessibilityEvent
        import com.korobov.haydaybot.data.BotProfile
        import com.korobov.haydaybot.data.PreferencesManager
        import com.korobov.haydaybot.engine.GeometryEngine
        import com.korobov.haydaybot.engine.GestureEngine
        import com.korobov.haydaybot.ui.OverlayHudManager
        import kotlinx.coroutines.*
        import kotlin.coroutines.CoroutineContext
        class HayDayAccessibilityService : AccessibilityService(), CoroutineScope {
            private val job = SupervisorJob()
            override val coroutineContext: CoroutineContext get() = Dispatchers.Default + job
            private lateinit var prefsManager: PreferencesManager
            private lateinit var gestureEngine: GestureEngine
            private lateinit var geometryEngine: GeometryEngine
            private var hudManager: OverlayHudManager? = null
            private var isRunning = false
            private var botJob: Job? = null
            var cyclesCount = 0
            var plantedCount = 0
            var harvestedCount = 0
            override fun onCreate() {
                super.onCreate()
                prefsManager = PreferencesManager(this)
                gestureEngine = GestureEngine(this)
                geometryEngine = GeometryEngine()
            }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
            override fun onInterrupt() { stopBot() }
            fun startBot() {
                if (isRunning) return
                isRunning = true
                hudManager = OverlayHudManager(this) { stopBot() }
                hudManager?.show()
                botJob = launch {
                    val profile = prefsManager.loadProfile()
                    var firstRun = true
                    while (isRunning) {
                        try {
                            if ((profile.scenePrepMode == 0 && firstRun) || profile.scenePrepMode == 1) {
                                performScenePreparation(profile)
                            }
                            firstRun = false
                            hudManager?.updateStatus("Фаза: Посадка", "Цикл: $cyclesCount")
                            executePlanting(profile)
                            plantedCount++
                            delay(profile.growTimeSec * 1000L)
                            hudManager?.updateStatus("Фаза: Сбор урожая", "Цикл: $cyclesCount")
                            executeHarvest(profile)
                            harvestedCount++
                            cyclesCount++
                            delay(3000L)
                        } catch (e: Exception) {
                            delay(5000L)
                        }
                    }
                }
            }
            fun stopBot() {
                isRunning = false
                botJob?.cancel()
                hudManager?.hide()
                hudManager = null
            }
            private suspend fun performScenePreparation(profile: BotProfile) {
                performGlobalAction(GLOBAL_ACTION_HOME)
                delay(1500L)
                packageManager.getLaunchIntentForPackage(profile.gamePkg)?.let {
                    it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    startActivity(it)
                }
                delay(profile.loadTimeSec * 1000L)
                val metrics = resources.displayMetrics
                val cx = metrics.widthPixels / 2f
                val cy = metrics.heightPixels / 2f
                for (i in 0 until profile.pinchRepeats) {
                    gestureEngine.performPinch(cx, cy, profile.pinchStartOffsetPercent, profile.pinchEndOffsetPercent, profile.pinchDurationMs, !profile.pinchInverted)
                    delay(500L)
                }
                delay(1000L)
            }
            private suspend fun executePlanting(profile: BotProfile) {
                val emptyPlot = profile.emptyPlotPoint ?: return
                val wheatIcon = profile.wheatIconPoint ?: return
                val corners = profile.fieldCorners
                if (corners.size < 4) return
                gestureEngine.performTap(emptyPlot.x, emptyPlot.y)
                delay(300L)
                gestureEngine.performTap(wheatIcon.x, wheatIcon.y)
                delay(300L)
                val route = geometryEngine.generateClosedRoute(corners)
                if (route.isNotEmpty()) gestureEngine.performContinuousGesture(route, (route.size * 60L).coerceIn(1000L, 50000L))
                delay(500L)
            }
            private suspend fun executeHarvest(profile: BotProfile) {
                val ripePlot = profile.ripePlotPoint ?: return
                val scythe = profile.scythePoint ?: return
                val corners = profile.fieldCorners
                if (corners.size < 4) return
                gestureEngine.performTap(ripePlot.x, ripePlot.y)
                delay(300L)
                gestureEngine.performTap(scythe.x, scythe.y)
                delay(300L)
                val route = geometryEngine.generateClosedRoute(corners)
                if (route.isNotEmpty()) gestureEngine.performContinuousGesture(route, (route.size * 60L).coerceIn(1000L, 50000L))
                delay(500L)
            }
            override fun onDestroy() {
                super.onDestroy()
                job.cancel()
                stopBot()
            }
        }
        EOF

