              Stp(Kind.DO, null, "Проверка сбора", "Бот соберет урожай по той же змейке.", btn = "🔪 Собрать", act = "harvest"),
              Stp(Kind.ASK, null, "Настроить продажу в лавке?", "Бот будет выкладывать пшеницу в слоты и давать рекламу на последнем слоте.", btn = "Да, настроить ▶", skip = "Без продажи"),
              Stp(Kind.TAP, T.SHOP, "Нажми на лавку", "Откроется придорожный магазин.", replay = true),
              Stp(Kind.TAP, T.SLOT, "Нажми на 1-й слот лавки", "Предыдущие слоты очистятся, запишется 1-й слот и соберется выручка.", replay = true, fresh = true),
              Stp(Kind.TAP, null, "Нажми на этот же слот ещё раз", "Откроется меню силосной башни.", replay = true, skip = "Уже открылось"),
              Stp(Kind.MULTI, T.ITEMS, "Отметь 4–6 ячеек списка культур", "Если другой культуры станет больше, пшеница сместится — бот найдет её по колосьям среди этих ячеек.", btn = "Готово ✓", skip = "Одно место", max = 8),
              Stp(Kind.TAP, T.ITEM, "Нажми на пшеницу в списке", "Сфотографирую верхнюю часть иконки (без цифр количества) для точного распознавания.", replay = true, sample = true),
              Stp(Kind.MULTI, T.EXTRA, "Нажми макс. цену / количество", "Эти клики повторятся при каждой выкладке.", replay = true, btn = "Дальше ▶"),
              Stp(Kind.TAP, T.AD, "Укажи кнопку галочки рекламы", "Реклама будет ставиться на последнем слоте не чаще раза в 5 минут.", skip = "Без рекламы"),
              Stp(Kind.TAP, T.PUT, "Укажи кнопку «Выставить»", "Запомню цвет кнопки для проверки открытия лота.", sample = true),
              Stp(Kind.INFO, null, "Закрой окно выбора товара", "Вернись к списку слотов лавки.", btn = "Окно закрыто ▶"),
              Stp(Kind.MULTI, T.SLOT, "Отметь остальные слоты на 1-м экране", "Нажимай со 2-го слота по порядку (1-й уже сохранен).", fresh = false, btn = "Готово ✓"),
              Stp(Kind.SWIPE, T.SWIPE, "Пролистай лавку влево", "Проведи пальцем для прокрутки слотов.", skip = "Один экран"),
              Stp(Kind.MULTI, T.SLOT2, "Отметь слоты на странице 2", "Или нажми «Те же места».", btn = "Готово ✓", skip = "Те же места"),
              Stp(Kind.DO, null, "Есть 3-я страница?", "Пролистаю ещё раз для 3-й страницы.", btn = "↔ Листать дальше", skip = "Это последняя", act = "swipe2"),
              Stp(Kind.MULTI, T.SLOT3, "Отметь слоты на странице 3", "Или жми «Те же места».", btn = "Готово ✓", skip = "Те же места"),
              Stp(Kind.TAP, T.CLOSE, "Нажми на крестик закрытия лавки", "Запомню вид крестика и закрою магазин.", replay = true, sample = true)
          )
          """)

          write_file("app/src/main/java/com/example/haybot/Geo.kt", """
          package com.example.haybot

          import java.util.Random
          import kotlin.math.atan2
          import kotlin.math.hypot
          import kotlin.math.max
          import kotlin.math.roundToInt

          object Geo {
              private val rng = Random()

              fun order(pts: List<P>): List<P> {
                  if (pts.size < 3) return pts
                  val cx = pts.map { it.x }.average().toFloat()
                  val cy = pts.map { it.y }.average().toFloat()
                  val sorted = pts.sortedBy { atan2((it.y - cy).toDouble(), (it.x - cx).toDouble()) }
                  val tlIdx = sorted.indices.minByOrNull { sorted[it].x + sorted[it].y } ?: 0
                  return List(sorted.size) { i -> sorted[(tlIdx + i) % sorted.size] }
              }

              private fun bilerp(q0: P, q1: P, q2: P, q3: P, u: Float, v: Float): P {
                  val tx = q0.x + (q1.x - q0.x) * u
                  val ty = q0.y + (q1.y - q0.y) * u
                  val bx = q3.x + (q2.x - q3.x) * u
                  val by = q3.y + (q2.y - q3.y) * u
                  return P(tx + (bx - tx) * v, ty + (by - ty) * v)
              }

              fun zigzag(pts: List<P>, gap: Float, w: Int = 0, h: Int = 0, edge: Int = 0): List<P> {
                  if (pts.size < 4) return pts
                  val q = order(pts)
                  return buildSnake(q[0], q[1], q[2], q[3], gap, w, h, edge)
              }

              fun zigzagFrom(pts: List<P>, gap: Float, near: P, w: Int = 0, h: Int = 0, edge: Int = 0): List<P> {
                  if (pts.size < 4) return pts
                  val q = order(pts)
                  val sc = q.indices.minByOrNull { hypot(q[it].x - near.x, q[it].y - near.y) } ?: 0
                  val snake = buildSnake(q[sc], q[(sc + 1) % 4], q[(sc + 2) % 4], q[(sc + 3) % 4], gap, w, h, edge).toMutableList()
                  val cNear = clamp(near, w, h, edge)
                  if (snake.isEmpty() || hypot(snake.first().x - cNear.x, snake.first().y - cNear.y) > 12f) {
                      snake.add(0, cNear)
                  }
                  return snake
              }

              private fun buildSnake(q0: P, q1: P, q2: P, q3: P, gap: Float, w: Int, h: Int, edge: Int): List<P> {
                  val sideA = max(hypot(q1.x - q0.x, q1.y - q0.y), hypot(q2.x - q3.x, q2.y - q3.y))
                  val sideB = max(hypot(q3.x - q0.x, q3.y - q0.y), hypot(q2.x - q1.x, q2.y - q1.y))
                  val sGap = gap.coerceAtLeast(15f)
                  val rows = max(2, (sideB / sGap).roundToInt() + 1)
                  val cols = max(3, (sideA / (sGap * 0.85f)).roundToInt() + 1)
                  val out = ArrayList<P>(rows * cols)
                  for (r in 0 until rows) {
                      val v = if (rows == 1) 0.5f else r.toFloat() / (rows - 1).toFloat()
                      for (c in 0 until cols) {
                          val ru = if (cols == 1) 0.5f else c.toFloat() / (cols - 1).toFloat()
                          val u = if (r % 2 == 0) ru else (1f - ru)
                          out.add(clamp(bilerp(q0, q1, q2, q3, u, v), w, h, edge))
                      }
                  }
                  return out
              }

              fun clamp(p: P, w: Int, h: Int, edge: Int): P {
                  if (w <= 0 || h <= 0 || edge <= 0) return p
                  val pct = edge.coerceIn(0, 25) / 100f
                  return P(p.x.coerceIn(w * pct, w * (1f - pct)), p.y.coerceIn(h * pct, h * (1f - pct)))
              }

              fun applyPlantMode(pts: List<P>, mode: Int, w: Int, h: Int, edge: Int): List<P> {
                  if (pts.size < 2) return pts
                  return when (mode) {
                      1 -> {
                          val res = ArrayList<P>(pts.size * 2)
                          for (i in 0 until pts.size - 1) {
                              val a = pts[i]; val b = pts[i + 1]
                              res.add(a)
                              res.add(P((a.x + b.x) * 0.5f, (a.y + b.y) * 0.5f))
                          }
                          res.add(pts.last())
                          res
                      }
                      2 -> {
                          pts.filterIndexed { idx, _ -> idx == 0 || idx == pts.size - 1 || idx % 2 == 0 }
                      }
                      3 -> {
                          val res = ArrayList<P>(pts.size * 2)
                          for (i in pts.indices) {
                              val cur = pts[i]
                              val jx = cur.x + (rng.nextGaussian().toFloat() * 2.5f).coerceIn(-5.5f, 5.5f)
                              val jy = cur.y + (rng.nextGaussian().toFloat() * 2.5f).coerceIn(-5.5f, 5.5f)
                              res.add(clamp(P(jx, jy), w, h, edge))
                              if (i < pts.size - 1) {
                                  val nxt = pts[i + 1]
                                  if (hypot(nxt.x - cur.x, nxt.y - cur.y) > 85f) {
                                      val mx = (cur.x + nxt.x) * 0.5f + (rng.nextFloat() - 0.5f) * 7f
                                      val my = (cur.y + nxt.y) * 0.5f + (rng.nextFloat() - 0.5f) * 7f
                                      res.add(clamp(P(mx, my), w, h, edge))
                                  }
                              }
                          }
                          res
                      }
                      else -> pts
                  }
              }

              fun jitterTap(p: P): P {
                  val dx = (rng.nextGaussian().toFloat() * 3.2f).coerceIn(-6f, 6f)
                  val dy = (rng.nextGaussian().toFloat() * 3.2f).coerceIn(-6f, 6f)
                  return P(p.x + dx, p.y + dy)
              }

              fun jitterDelay(ms: Long, speedPct: Int = 100): Long {
                  val scaled = (ms * 100L) / speedPct.coerceIn(50, 300)
                  val d = ((rng.nextFloat() * 2f - 1f) * 0.14f * scaled).toLong()
                  return (scaled + d).coerceAtLeast(30L)
              }
          }
          """)

          write_file("app/src/main/java/com/example/haybot/Vision.kt", """
          package com.example.haybot

          import android.graphics.Bitmap
          import android.graphics.Color
          import kotlin.math.abs
          import kotlin.math.roundToInt
          import kotlin.math.sqrt

          object Vision {
              private const val PW = 20
              private const val PH = 16
              private const val EXPECTED_LEN = PW * PH

              fun sampleColor(bmp: Bitmap, p: P): Int {
                  val cx = p.x.roundToInt().coerceIn(0, bmp.width - 1)
                  val cy = p.y.roundToInt().coerceIn(0, bmp.height - 1)
                  var r = 0; var g = 0; var b = 0; var cnt = 0
                  for (dy in -2..2) {
                      val y = (cy + dy).coerceIn(0, bmp.height - 1)
                      for (dx in -2..2) {
                          val x = (cx + dx).coerceIn(0, bmp.width - 1)
                          val c = bmp.getPixel(x, y)
                          r += Color.red(c); g += Color.green(c); b += Color.blue(c); cnt++
                      }
                  }
                  return Color.rgb(r / cnt, g / cnt, b / cnt)
              }

              fun matchesColor(bmp: Bitmap, p: P, ref: Int, maxDist: Double = 52.0): Boolean {
                  val cx = p.x.roundToInt()
                  val cy = p.y.roundToInt()
                  var best = Double.MAX_VALUE
                  for (dy in -3..3 step 3) {
                      for (dx in -3..3 step 3) {
                          val c = sampleColor(bmp, P((cx + dx).toFloat(), (cy + dy).toFloat()))
                          val dr = (Color.red(c) - Color.red(ref)).toDouble()
                          val dg = (Color.green(c) - Color.green(ref)).toDouble()
                          val db = (Color.blue(c) - Color.blue(ref)).toDouble()
                          val d = sqrt(dr * dr + dg * dg + db * db)
                          if (d < best) best = d
                      }
                  }
                  return best <= maxDist
              }

              fun extractCropIconPatch(bmp: Bitmap, center: P): IntArray {
                  val cx = center.x.roundToInt()
                  val cy = center.y.roundToInt()
                  val out = IntArray(EXPECTED_LEN)
                  var i = 0
                  for (dy in -14 until 2) {
                      val y = (cy + dy).coerceIn(0, bmp.height - 1)
                      for (dx in -10 until 10) {
                          val x = (cx + dx).coerceIn(0, bmp.width - 1)
                          out[i++] = bmp.getPixel(x, y) and 0xFFFFFF
                      }
                  }
                  return out
              }

              fun findBestCropCell(bmp: Bitmap, candidates: List<P>, refPatch: IntArray?, threshold: Double = 82.0): P? {
                  if (candidates.isEmpty()) return null
                  if (refPatch == null || refPatch.size != EXPECTED_LEN) return candidates.first()

                  var bestP: P? = null
                  var bestScore = 0.0

                  for (pt in candidates) {
                      val bx = pt.x.roundToInt()
                      val by = pt.y.roundToInt()
                      var bestLocalScore = 0.0

                      for (oy in -6..6 step 2) {
                          for (ox in -6..6 step 2) {
                              var weightedErr = 0.0
                              var weightSum = 0.0
                              var idx = 0
                              for (dy in -14 until 2) {
                                  val y = (by + oy + dy).coerceIn(0, bmp.height - 1)
                                  for (dx in -10 until 10) {
                                      val x = (bx + ox + dx).coerceIn(0, bmp.width - 1)
                                      val px = bmp.getPixel(x, y)
                                      val rf = refPatch[idx++]

                                      val r1 = Color.red(px); val g1 = Color.green(px); val b1 = Color.blue(px)
                                      val r2 = (rf shr 16) and 0xFF; val g2 = (rf shr 8) and 0xFF; val b2 = rf and 0xFF

                                      val sat2 = maxOf(r2, g2, b2) - minOf(r2, g2, b2)
                                      val w = if (sat2 > 38) 3.0 else 0.7

                                      val rgbDiff = (abs(r1 - r2) + abs(g1 - g2) + abs(b1 - b2)) / 3.0
                                      val chromaDiff = (abs((r1 - b1) - (r2 - b2)) + abs((g1 - b1) - (g2 - b2))) * 0.65

                                      weightedErr += (rgbDiff + chromaDiff) * w
                                      weightSum += 255.0 * w
                                  }
                              }
                              val sim = (1.0 - (weightedErr / weightSum).coerceIn(0.0, 1.0)) * 100.0
                              if (sim > bestLocalScore) bestLocalScore = sim
                          }
                      }
                      if (bestLocalScore > bestScore) {
                          bestScore = bestLocalScore
                          bestP = pt
                      }
                  }
                  return if (bestScore >= threshold) bestP else null
              }
          }
          """)

          write_file("app/src/main/java/com/example/haybot/MarkView.kt", """
          package com.example.haybot

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.hypot

          class MarkView(ctx: Context, private val cfg: Cfg) : View(ctx) {
              var armed = false
              var showAll = false
              var onTap: ((Float, Float) -> Unit)? = null
              var swipeMode = false
              var onSwipe: ((P, P, Long) -> Unit)? = null
              private var downT = 0L
              var editMode = false
              var editPts: MutableList<P>? = null
              private var dragIdx = -1
              private var lastX = 0f
              private var lastY = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val poly = Path()
              private val loc = IntArray(2)
              private var down = false
              private var dx = 0f
              private var dy = 0f

              private fun inside(pts: List<P>, x: Float, y: Float): Boolean {
                  val q = Geo.order(pts)
                  var res = false
                  var j = q.size - 1
                  for (i in q.indices) {
                      if ((q[i].y > y) != (q[j].y > y) &&
                          x < (q[j].x - q[i].x) * (y - q[i].y) / (q[j].y - q[i].y) + q[i].x
                      ) res = !res
                      j = i
                  }
                  return res
              }

              private fun handleEdit(e: MotionEvent, pts: MutableList<P>): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          lastX = e.rawX; lastY = e.rawY; dragIdx = -1
                          var best = 110f
                          for (i in pts.indices) {
                              val d = hypot(pts[i].x - e.rawX, pts[i].y - e.rawY)
                              if (d < best) { best = d; dragIdx = i }
                          }
                          if (dragIdx == -1 && inside(pts, e.rawX, e.rawY)) dragIdx = -2
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val ddx = e.rawX - lastX; val ddy = e.rawY - lastY
                          if (dragIdx >= 0) pts[dragIdx] = P(e.rawX, e.rawY)
                          else if (dragIdx == -2) for (i in pts.indices) pts[i] = P(pts[i].x + ddx, pts[i].y + ddy)
                          lastX = e.rawX; lastY = e.rawY; invalidate()
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> dragIdx = -1
                  }
                  return true
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (!armed) return false
                  val ep = editPts
                  if (editMode && ep != null) return handleEdit(e, ep)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { down = true; dx = e.rawX; dy = e.rawY; downT = System.currentTimeMillis() }
                      MotionEvent.ACTION_UP -> {
                          if (down) {
                              down = false
                              val ux = e.rawX; val uy = e.rawY
                              if (swipeMode && hypot(ux - dx, uy - dy) >= 80f) onSwipe?.invoke(P(dx, dy), P(ux, uy), System.currentTimeMillis() - downT)
                              else onTap?.invoke(dx, dy)
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> down = false
                  }
                  return true
              }

              override fun onDraw(c: Canvas) {
                  if (!armed && !showAll) return
                  getLocationOnScreen(loc)
                  val ox = loc[0].toFloat(); val oy = loc[1].toFloat()
                  if (armed) c.drawColor(0x30FFEB3B)
                  val area: List<P> = editPts ?: cfg.list(T.AREA)
                  if (area.size >= 3) {
                      val q = Geo.order(area)
                      poly.reset()
                      poly.moveTo(q[0].x - ox, q[0].y - oy)
                      for (i in 1 until q.size) poly.lineTo(q[i].x - ox, q[i].y - oy)
                      poly.close()
                      p.style = Paint.Style.FILL; p.color = 0x3329B6F6; c.drawPath(poly, p)
                      p.style = Paint.Style.STROKE; p.strokeWidth = 4f; p.color = T.AREA.color; c.drawPath(poly, p)
                  }
                  if (area.size >= 4) {
                      val f = cfg.first(T.FIELD)
                      val z = if (f != null) Geo.zigzagFrom(area, cfg.rowGap.toFloat(), f, width, height, cfg.edgePct)
                              else Geo.zigzag(area, cfg.rowGap.toFloat(), width, height, cfg.edgePct)
                      p.style = Paint.Style.STROKE; p.strokeWidth = 3f; p.color = 0xCCFFFFFF.toInt()
                      for (i in 1 until z.size) c.drawLine(z[i - 1].x - ox, z[i - 1].y - oy, z[i].x - ox, z[i].y - oy, p)
                  }
                  if (editMode) {
                      for (q in area) {
                          p.style = Paint.Style.FILL; p.color = Color.WHITE; c.drawCircle(q.x - ox, q.y - oy, 34f, p)
                          p.color = T.AREA.color; c.drawCircle(q.x - ox, q.y - oy, 24f, p)
                      }
                  }
                  p.style = Paint.Style.FILL
                  for (t in T.values()) {
                      for ((i, pt) in cfg.list(t).withIndex()) {
                          p.color = t.color; c.drawCircle(pt.x - ox, pt.y - oy, 20f, p)
                          p.color = Color.WHITE; p.textSize = 30f
                          val label = t.icon + (if (t.multi) (i + 1).toString() else "")
                          c.drawText(label, pt.x - ox + 24f, pt.y - oy + 10f, p)
                      }
                  }
              }
          }
          """)

